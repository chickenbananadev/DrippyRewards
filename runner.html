<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Drippy Bone Rush</title>
<meta name="description" content="Run the jungle, dodge the ruins and collect bones before the Stone Guardian catches you.">
<meta name="theme-color" content="#05030a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Anton&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#f5c542;--cream:#f6e9c4;--dim:rgba(246,233,196,.64);--purple:#a259ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#05030a;color:var(--cream);font-family:'JetBrains Mono',monospace;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;background:#05030a}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 12px)}
.hudrow{display:flex;justify-content:space-between;gap:10px}.stack{display:flex;flex-direction:column;gap:8px;align-items:flex-start}.stack.right{align-items:flex-end}
.pill{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:rgba(12,8,8,.78);border:1px solid rgba(245,197,66,.42);box-shadow:0 4px 18px rgba(0,0,0,.36);font-weight:700;color:#ffd966;font-size:14px;backdrop-filter:blur(6px)}
.pill img{width:20px;height:20px;object-fit:contain}.pill.button{pointer-events:auto;cursor:pointer}
#powers{display:flex;gap:6px}.power{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(8,6,12,.82);border:2px solid rgba(245,197,66,.48)}.power img{width:25px;height:25px}.power .ring{position:absolute;inset:-2px;border-radius:50%;border:3px solid transparent;border-top-color:var(--gold);transform:rotate(var(--r,0deg))}
#toast{position:absolute;top:38%;left:50%;transform:translate(-50%,0);font-family:'Anton',sans-serif;letter-spacing:3px;text-transform:uppercase;color:#ffd966;text-shadow:0 4px 16px #000;font-size:clamp(16px,4vw,24px);opacity:0;white-space:nowrap}
.screen{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 42%,rgba(25,15,32,.62),rgba(3,2,6,.88));backdrop-filter:blur(2px)}
.screen.on{display:grid}.inner{width:min(92vw,470px)}
h1{font-family:'Bowlby One',sans-serif;line-height:.98;color:var(--gold);font-size:clamp(38px,10vw,64px);text-shadow:0 8px 32px rgba(0,0,0,.58)}h1 span{color:var(--purple)}
.tag{font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:4px;color:var(--dim);font-size:13px;margin:10px 0 22px}.btn{border:0;border-radius:14px;padding:15px 38px;background:linear-gradient(135deg,#b17b21,#ffd966);color:#1a1005;font-family:'Anton',sans-serif;font-size:19px;text-transform:uppercase;letter-spacing:3px;cursor:pointer;box-shadow:0 8px 28px rgba(245,197,66,.26)}.btn:active{transform:scale(.97)}.ghost{margin-top:12px;background:rgba(8,6,12,.65);color:var(--cream);border:1px solid rgba(246,233,196,.18);box-shadow:none}.help{margin-top:18px;color:var(--dim);font-size:12px;line-height:1.9}.help b{color:#ffd966}
.scoregrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.scorebox{border:1px solid rgba(245,197,66,.22);border-radius:14px;padding:13px;background:rgba(8,6,12,.66)}.scorebox small{display:block;color:var(--dim);text-transform:uppercase;letter-spacing:2px;font-family:'Anton',sans-serif}.scorebox strong{display:block;color:#ffd966;font-family:'Bowlby One',sans-serif;font-size:26px;margin-top:4px}.submit{display:flex;gap:8px;margin:0 0 12px}.submit input{min-width:0;flex:1;padding:12px;border-radius:12px;border:1px solid rgba(245,197,66,.35);background:rgba(8,6,12,.82);color:#ffd966;text-align:center;text-transform:uppercase;font-family:inherit;font-size:14px;outline:none}.submit .btn{padding:11px 14px;font-size:13px}.note{min-height:18px;color:var(--dim);font-size:12px;margin-bottom:12px}
@media(max-width:420px){.pill{font-size:13px;padding:6px 10px}.power{width:36px;height:36px}}
/* --- polish pass: motion + feedback (visual only, no gameplay change) --- */
@keyframes pillPop{0%{transform:scale(1)}35%{transform:scale(1.14)}100%{transform:scale(1)}}
.pill.pop{animation:pillPop .28s cubic-bezier(.22,1,.36,1)}
.btn{position:relative;overflow:hidden;transition:transform .18s ease,box-shadow .18s ease}
.btn:not(.ghost)::after{content:'';position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-18deg);animation:btnShine 3.4s ease-in-out infinite}
@keyframes btnShine{0%,70%{left:-70%}100%{left:140%}}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(245,197,66,.42)}
.btn:active{transform:scale(.96)}
@keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.screen.on .inner{animation:riseIn .45s cubic-bezier(.22,1,.36,1)}
.screen.on .scorebox{animation:riseIn .5s cubic-bezier(.22,1,.36,1) both}
.screen.on .scorebox:nth-child(2){animation-delay:.08s}
#start h1{animation:titleGlow 2.8s ease-in-out infinite}
@keyframes titleGlow{0%,100%{text-shadow:0 8px 32px rgba(0,0,0,.58),0 0 24px rgba(245,197,66,.22)}50%{text-shadow:0 8px 32px rgba(0,0,0,.58),0 0 46px rgba(245,197,66,.5)}}
.power.low{animation:lowBlink .5s steps(2) infinite}
@keyframes lowBlink{to{border-color:rgba(255,110,90,.9)}}
@media (prefers-reduced-motion:reduce){.btn:not(.ghost)::after,#start h1,.screen.on .inner,.screen.on .scorebox,.pill.pop{animation:none}}
</style>
</head>
<body>
<div id="game"><canvas id="cv"></canvas></div>
<div id="hud">
  <div class="hudrow">
    <div class="stack"><div class="pill" id="bonePill"><img src="assets/runner/bone_gold.png" alt=""><span id="bones">0</span></div><div class="pill" id="livesPill" style="color:#ff8093"><span id="lives">♥♥♥</span></div><div id="powers"></div></div>
    <div class="stack right"><div class="pill"><span id="dist">0</span>m</div><div class="pill button" id="pause">❚❚</div></div>
  </div>
  <div id="toast"></div>
</div>
<div class="screen on" id="start"><div class="inner"><h1>DRIPPY <span>BONE RUSH</span></h1><div class="tag">Run. Dodge. Collect. Survive.</div><button class="btn" id="play">Run</button><div class="help"><b>Swipe</b> left/right to change lanes<br><b>Swipe up</b> to jump · <b>Swipe down</b> to slide<br>Collect bones. Every mistake brings the Guardian closer.</div></div></div>
<div class="screen" id="paused"><div class="inner"><h1>PAUSED</h1><div class="tag">Catch your breath</div><button class="btn" id="resume">Resume</button><button class="btn ghost" id="quit">End Run</button></div></div>
<div class="screen" id="over"><div class="inner"><h1 id="overTitle">CAUGHT</h1><div class="tag" id="overTag">The Guardian got you</div><div class="scoregrid"><div class="scorebox"><small>Distance</small><strong><span id="od">0</span>m</strong></div><div class="scorebox"><small>Bones</small><strong id="ob">0</strong></div></div><div class="submit"><input id="name" maxlength="12" placeholder="YOUR NAME" autocomplete="off"><button class="btn" id="submit">Log</button></div><div class="note" id="note"></div><button class="btn" id="again">Run Again</button><br><a href="/arcade" class="btn ghost" style="display:inline-block;text-decoration:none">Back to Arcade</a></div></div>

<script>
(function(){
'use strict';
var cv=document.getElementById('cv'),ctx=cv.getContext('2d',{alpha:false});
var W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.floor(W*DPR);cv.height=Math.floor(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);addEventListener('orientationchange',resize);

var A={};
function load(name,file){var i=new Image();i.decoding='async';i.src='assets/runner/'+(file||name+'.png');A[name]=i;return i}
for(var i=1;i<=7;i++)load('run'+i);
['jump_back','slide_back','stumble','shielded','lean_l','lean_r','bone','bone_gold','bone_blue','bone_rainbow','bone_black','biscuit','coin','x2','magnet','wingbone','shield','shoe','ob_log','ob_boulder','ob_crate','ob_fire','ob_spikewall','ob_rope','ob_block','ob_spikes','ob_wall','ob_branch','guard1','guard2','guard3','guard_roar','fx_dust','fx_speed','fx_stars','tile_path','prop_bush','prop_rocks','prop_bush2','prop_pillar','prop_wall','prop_torch'].forEach(function(n){load(n)});
var SCENES=7,JUNGLE_ORDER=[1,3,5,2,7,4,6];for(i=1;i<=SCENES;i++)load('bg'+i,'bg_jungle_'+i+'.jpg');

var LANE=172,LANES=[-LANE,0,LANE],CAM_Y=720,PLAYER_Z=1050,ROAD=LANE*2.15,Z_FAR=8200,Z_CULL=300,GRAV=3000,SPEED_MIN=1450,SPEED_MAX=3000;
/* The track sweeps left and right as the run progresses. The bend is purely
   visual — zero at the player's depth and growing quadratically with
   distance, applied inside project() so the road, props, obstacles and
   bones all follow the same curve while lanes and collision stay fair. */
function bendX(z){if(!S)return 0;var t=Math.max(0,(z-PLAYER_Z)/6200);return S.curve*t*t*W*.8}
function focal(){return Math.max(W,520)*0.95}function horizon(){return H*0.285}function project(x,y,z){var s=focal()/Math.max(1,z);return{x:W/2+x*s+bendX(z),y:horizon()+(CAM_Y-y)*s,s:s}}

var OB=[{key:'ob_log',act:'jump',h:150,y:0},{key:'ob_crate',act:'jump',h:165,y:0},{key:'ob_spikes',act:'jump',h:120,y:0},{key:'ob_branch',act:'slide',h:155,y:215},{key:'ob_rope',act:'slide',h:165,y:205},{key:'ob_boulder',act:'dodge',h:245,y:0},{key:'ob_block',act:'dodge',h:235,y:0},{key:'ob_fire',act:'dodge',h:225,y:0},{key:'ob_spikewall',act:'dodge',h:230,y:0},{key:'ob_wall',act:'dodge',h:240,y:0}];
var POW={magnet:{icon:'magnet',dur:5,label:'BONE MAGNET'},shield:{icon:'shield',dur:5,label:'DRIP SHIELD'},zoomies:{icon:'shoe',dur:5,label:'ZOOMIES'},x2:{icon:'x2',dur:5,label:'2X TREATS'},superjump:{icon:'wingbone',dur:5,label:'SUPER JUMP'}};
var BK=[{key:'bone',v:1,p:.68},{key:'bone_gold',v:3,p:.16},{key:'bone_blue',v:5,p:.09},{key:'bone_rainbow',v:10,p:.05},{key:'bone_black',v:25,p:.02}];

/* boneRushBest is the new save; drippyDash is the key the game shipped with
   and the one the arcade page's "personal best" card reads — keep reading
   and writing it so nobody's best is wiped and the cabinet stays honest. */
var S=null,best={dist:0,bones:0};try{best=JSON.parse(localStorage.getItem('boneRushBest')||localStorage.getItem('drippyDash')||'null')||best}catch(e){}
function state(){return{mode:'play',t:0,dist:0,speed:SPEED_MIN,bones:0,lane:1,laneX:0,targetX:0,y:0,vy:0,air:false,slide:0,stumble:0,iframe:0,anim:0,spawnZ:1800,ob:[],pk:[],fx:[],powers:{},guard:.1,shake:0,caught:0,near:0,curve:0,curveT:0,curveAt:200,lives:3,cruise:SPEED_MIN,sq:0,camDip:0,camDipV:0,camAir:0,floats:[],nextMile:500,miles:0,flash:0}}
function $(id){return document.getElementById(id)}
function toast(t,c){var e=$('toast');e.textContent=t;e.style.color=c||'#ffd966';e.style.transition='none';e.style.opacity=1;e.style.transform='translate(-50%,6px) scale(.84)';requestAnimationFrame(function(){e.style.transition='opacity .8s ease,transform .8s cubic-bezier(.22,1,.36,1)';e.style.opacity=0;e.style.transform='translate(-50%,-28px) scale(1)'})}

function move(d){if(!S||S.mode!=='play')return;var n=Math.max(0,Math.min(2,S.lane+d));if(n!==S.lane){S.lane=n;S.targetX=LANES[n];SFX.click()}}
function jump(){if(!S||S.mode!=='play'||S.air||S.slide>0)return;S.vy=S.powers.superjump?2000:1580;S.air=true;S.sq=.2;SFX.jump()}
function slide(){if(!S||S.mode!=='play'||S.slide>0)return;if(S.air)S.vy=-1500;S.slide=.62;SFX.slide()}
addEventListener('keydown',function(e){var k=e.key.toLowerCase();if(k==='arrowleft'||k==='a'){move(-1);e.preventDefault()}else if(k==='arrowright'||k==='d'){move(1);e.preventDefault()}else if(k==='arrowup'||k==='w'||k===' '){jump();e.preventDefault()}else if(k==='arrowdown'||k==='s'){slide();e.preventDefault()}else if(k==='escape'||k==='p')togglePause()});
var sx=0,sy=0,moved=false;cv.addEventListener('touchstart',function(e){var t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;moved=false},{passive:true});cv.addEventListener('touchmove',function(e){if(moved)return;var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)<24&&Math.abs(dy)<24)return;moved=true;if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else dy<0?jump():slide()},{passive:true});

function pickBone(){var r=Math.random(),a=0;for(var i=0;i<BK.length;i++){a+=BK[i].p;if(r<a)return BK[i]}return BK[0]}
function boneRun(l,z,n,arc){for(var i=0;i<n;i++){var b=pickBone();S.pk.push({kind:'bone',key:b.key,v:b.v,lane:l,z:z+i*190,y:arc?Math.sin(i/Math.max(1,n-1)*Math.PI)*230:55,spin:Math.random()*6})}}
function power(l,z){var ks=Object.keys(POW),k=ks[(Math.random()*ks.length)|0];S.pk.push({kind:'power',key:POW[k].icon,power:k,lane:l,z:z,y:120,spin:0})}
function spawn(z){var diff=Math.min(1,S.dist/2600),free=(Math.random()*3)|0,r=Math.random();if(r<.19-diff*.07){boneRun((Math.random()*3)|0,z,7+((Math.random()*4)|0),Math.random()<.35)}else if(r<.56){var l=(Math.random()*3)|0,o=OB[(Math.random()*OB.length)|0];S.ob.push({o:o,lane:l,z:z,hit:false});boneRun(o.act==='dodge'?(l+1+((Math.random()*2)|0))%3:l,z-250,5,o.act==='jump')}else if(r<.86){for(var x=0;x<3;x++)if(x!==free)S.ob.push({o:OB[(Math.random()*OB.length)|0],lane:x,z:z+(Math.random()*150-75),hit:false});boneRun(free,z-180,6,false)}else{var act=Math.random()<.5?'slide':'jump',pool=OB.filter(function(o){return o.act===act}),p=pool[(Math.random()*pool.length)|0];for(x=0;x<3;x++)S.ob.push({o:p,lane:x,z:z,hit:false});boneRun((Math.random()*3)|0,z+520,5,act==='jump')}if(Math.random()<.13)power((Math.random()*3)|0,z+850);if(S.dist>300&&S.lives<5&&Math.random()<Math.min(.05,.006+S.dist/22000)){S.pk.push({kind:'life',key:'biscuit',lane:(Math.random()*3)|0,z:z+1300,y:110,spin:0})}return 2380+Math.random()*980-diff*680}
function give(k){S.powers[k]=POW[k].dur;toast(POW[k].label,k==='shield'?'#8fdcff':'#ffd966');SFX.power()}
function stumble(){if(S.iframe>0)return;if(S.powers.shield){delete S.powers.shield;S.iframe=1;toast('SHIELD BROKE','#8fdcff');SFX.shield();return}
 S.stumble=.7;S.iframe=1.15;S.speed=Math.max(SPEED_MIN*.78,S.speed*.68);S.guard=Math.min(1,S.guard+.34);S.shake=13;SFX.hit();
 S.lives--;livesHud();
 if(S.lives<=0)catchPlayer();
 else toast(S.lives===1?'LAST LIFE':S.lives+' LIVES LEFT','#ff8093')}
function livesHud(){var lp=$('livesPill');$('lives').textContent=new Array(Math.max(0,S.lives)+1).join('\u2665')||'\u2014';lp.classList.remove('pop');void lp.offsetWidth;lp.classList.add('pop')}
function catchPlayer(){if(S.mode!=='play')return;S.mode='caught';S.caught=0;S.flash=1;SFX.roar();MUSIC.stop()}

function update(dt){
 if(!S)return;
 if(S.mode==='caught'){S.caught+=dt;S.speed*=.9;if(S.flash>0)S.flash=Math.max(0,S.flash-dt*2.4);if(S.caught>1.1)end();return}
 if(S.mode!=='play')return;
 S.t+=dt;for(var k in S.powers){S.powers[k]-=dt;if(S.powers[k]<=0)delete S.powers[k]}
 var boost=S.powers.zoomies?1.36:1;
 /* the run EARNS a cruise speed that only climbs; a crash cuts the actual
    speed, which then springs back to cruise within ~3 seconds instead of
    grinding all the way back up */
 S.cruise=Math.min(SPEED_MAX,S.cruise+34*dt);
 S.speed+=(S.cruise-S.speed)*Math.min(1,dt*1.5);
 var v=S.speed*boost;S.dist+=v*dt/100;S.anim+=v*dt*.0017;
 /* turns: every stretch picks a new sweep (or a straight) and the road eases
    into it over a couple of seconds */
 if(S.dist>=S.curveAt){var CT=[0,0,.34,-.34,.5,-.5,.62,-.62];S.curveT=CT[(Math.random()*CT.length)|0];S.curveAt=S.dist+240+Math.random()*320}
 S.curve+=(S.curveT-S.curve)*Math.min(1,dt*.55);
 /* game-feel springs: squash/stretch relaxes, the camera dips on landings,
    lifts a touch in the air, and everything decays smoothly */
 S.sq+=(0-S.sq)*Math.min(1,dt*9);
 S.camDip+=S.camDipV*dt;S.camDipV-=(S.camDip*150+S.camDipV*9)*dt;
 S.camAir+=((S.air?-7:0)-S.camAir)*Math.min(1,dt*6);
 if(S.dist>=S.nextMile){var MTXT=['THE RUINS DEEPEN','THE PACK HOWLS','THE GUARDIAN STIRS','LEGEND PACE','UNCHARTED JUNGLE'];toast(S.nextMile+'m \u00b7 '+MTXT[((S.nextMile/500-1)|0)%MTXT.length]);S.miles=1;SFX.mile();S.nextMile+=500}
 if(S.miles>0)S.miles=Math.max(0,S.miles-dt*1.4);
 if(S.flash>0)S.flash=Math.max(0,S.flash-dt*2.4);
 for(var fi=S.floats.length-1;fi>=0;fi--){S.floats[fi].life-=dt;if(S.floats[fi].life<=0)S.floats.splice(fi,1)}
 S.laneX+=(S.targetX-S.laneX)*Math.min(1,dt*13);
 if(S.air){S.vy-=GRAV*dt;S.y+=S.vy*dt;if(S.y<=0){S.y=0;S.vy=0;S.air=false;S.sq=-.32;S.camDipV+=30;S.shake=Math.max(S.shake,4);dust(S.laneX,PLAYER_Z,false);SFX.land()}}
 if(S.slide>0)S.slide-=dt;if(S.stumble>0)S.stumble-=dt;if(S.iframe>0)S.iframe-=dt;if(S.shake>0)S.shake=Math.max(0,S.shake-dt*36);S.guard=Math.max(.05,S.guard-dt*.05);
 S.spawnZ-=v*dt;if(S.spawnZ<=0)S.spawnZ=spawn(Z_FAR);
 var i,o,p;
 for(i=S.ob.length-1;i>=0;i--){o=S.ob[i];o.z-=v*dt;if(o.z<Z_CULL){S.ob.splice(i,1);continue}if(!o.hit&&Math.abs(o.z-PLAYER_Z)<185&&o.lane===S.lane){var ok=(o.o.act==='jump'&&S.y>130)||(o.o.act==='slide'&&S.slide>0);o.hit=true;if(ok){S.near=.45;toast('NEAR MISS','#8fdcff');SFX.near()}else stumble()}}
 for(i=S.pk.length-1;i>=0;i--){p=S.pk[i];p.z-=v*dt;p.spin+=dt*3;if(p.z<Z_CULL){S.pk.splice(i,1);continue}if(S.powers.magnet&&p.kind==='bone'&&p.z<PLAYER_Z+2200)p.lane+=(S.lane-p.lane)*Math.min(1,dt*4);if(Math.abs(p.z-PLAYER_Z)<205&&Math.abs(p.lane-S.lane)<.52&&Math.abs(p.y-(S.y+90))<210){if(p.kind==='bone'){var vv=p.v*(S.powers.x2?2:1);S.bones+=vv;SFX.coin(p.v);var lxx=LANES[Math.round(p.lane)]||0;dust(lxx,p.z,true);var cp=project(lxx,p.y,p.z);addFloat('+'+vv,cp.x,cp.y-36,p.v>=5?'#8fdcff':'#ffd966');S.fx.push({x:lxx,z:p.z,life:.32,max:.32,ring:true})}else if(p.kind==='life'){S.lives=Math.min(5,S.lives+1);livesHud();toast('+1 LIFE','#ff8093');SFX.power();var lp2=project(LANES[Math.round(p.lane)]||0,p.y,p.z);addFloat('+\u2665',lp2.x,lp2.y-36,'#ff8093')}else give(p.power);S.pk.splice(i,1)}}
 for(i=S.fx.length-1;i>=0;i--){S.fx[i].life-=dt;S.fx[i].z-=v*dt;if(S.fx[i].life<=0)S.fx.splice(i,1)}
 if(S.near>0)S.near-=dt;hud()
}
function dust(x,z,gold){S.fx.push({x:x,z:z,life:.36,max:.36,gold:gold})}
function addFloat(t,x,y,c){if(S.floats.length<12)S.floats.push({t:t,x:x,y:y,c:c||'#ffd966',life:.75,max:.75})}
/* soft radial glow sprites, rendered once per colour and reused — canvas
